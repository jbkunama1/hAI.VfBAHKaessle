services:
  bierkaessle_web:
    image: ghcr.io/${GHCR_OWNER:-jbkunama1}/hai.vfbahkaessle:latest
    container_name: bierkaessle_web
    ports:
      - "1904:1904"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me}
      - BEER_PRICE=${BEER_PRICE:-1.50}
      - ADMIN_USERNAMES=${ADMIN_USERNAMES:-daniel}
    volumes:
      - bierkaessle_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:1904/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  bierkaessle_bot:
    image: ghcr.io/${GHCR_OWNER:-jbkunama1}/hai.vfbahkaessle:latest
    container_name: bierkaessle_bot
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - BEER_PRICE=${BEER_PRICE:-1.50}
      - TZ=Europe/Berlin
      - STATUS_DAILY_TIME=${STATUS_DAILY_TIME:-23:00}
      - STATUS_POLL_SECONDS=${STATUS_POLL_SECONDS:-30}
    volumes:
      - bierkaessle_data:/app/instance
    command: ["python", "telegram_bot.py"]
    restart: unless-stopped
    depends_on:
      bierkaessle_web:
        condition: service_healthy

    volumes:
      bierkaessle_data:
