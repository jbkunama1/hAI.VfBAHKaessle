{% extends 'base.html' %}
{% set title = t('page.register.title') %}
{% block content %}
<h1>{{ t('register.heading') }}</h1>

<div class="alert alert-info">
    {{ t('register.hint') }}
</div>

<form method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="username" class="form-label">{{ t('form.username') }}</label>
        <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
    </div>
    <div class="mb-3">
        <label for="password" class="form-label">{{ t('form.password') }}</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="new-password">
    </div>
    <button type="submit" class="btn btn-primary">{{ t('register.submit') }}</button>
</form>

<p class="mt-3">{{ t('register.has_account') }} <a href="{{ url_for('login') }}">{{ t('register.login_link') }}</a></p>
{% endblock %}
