{% extends 'base.html' %}
{% set title = t('page.forgot_password.title') %}
{% block content %}
<h1>{{ t('forgot_password.heading') }}</h1>
<p>{{ t('forgot_password.info') }}</p>

<form method="post" class="mt-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3">
        <label for="username" class="form-label">{{ t('form.username') }}</label>
        <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
    </div>
    <button type="submit" class="btn btn-primary">{{ t('action.send_request') }}</button>
</form>

<p class="mt-3"><a href="{{ url_for('login') }}">{{ t('forgot_password.back_login') }}</a></p>
{% endblock %}
