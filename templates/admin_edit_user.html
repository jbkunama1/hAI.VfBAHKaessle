{% extends 'base.html' %}
{% set title = t('page.admin_edit_user.title') %}
{% block content %}
<h1>{{ t('admin_edit_user.heading') }}</h1>
<p class="text-muted">{{ edit_user.username }}</p>
<p><a href="{{ url_for('admin_dashboard') }}">{{ t('admin.back_overview') }}</a></p>

<form method="post" class="row g-3">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="col-md-6">
        <label for="username" class="form-label">{{ t('form.username') }}</label>
        <input type="text" id="username" name="username" class="form-control" value="{{ edit_user.username }}" required>
    </div>
    <div class="col-md-6">
        <label for="telegram_id" class="form-label">{{ t('form.telegram_id') }} ({{ t('form.optional') }})</label>
        <input type="number" id="telegram_id" name="telegram_id" class="form-control" value="{{ edit_user.telegram_id or '' }}" placeholder="{{ t('form.optional') }}">
    </div>
    <div class="col-md-6">
        <label for="phone" class="form-label">{{ t('form.phone') }} ({{ t('form.optional') }})</label>
        <input type="tel" id="phone" name="phone" class="form-control" value="{{ edit_user.phone or '' }}">
    </div>
    <div class="col-md-6">
        <label for="email" class="form-label">{{ t('form.email') }} ({{ t('form.optional') }})</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ edit_user.email or '' }}">
    </div>
    <div class="col-md-6">
        <label for="birthday" class="form-label">{{ t('form.birthday') }} ({{ t('form.optional') }})</label>
        <input type="date" id="birthday" name="birthday" class="form-control" value="{{ edit_user.birthday or '' }}">
    </div>
    <div class="col-md-6">
        <label for="new_password" class="form-label">{{ t('form.new_password') }}</label>
        <input type="password" id="new_password" name="new_password" class="form-control" placeholder="{{ t('admin_edit_user.password_hint') }}">
    </div>
    <div class="col-12">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" role="switch" id="is_admin" name="is_admin" {% if edit_user.is_admin %}checked{% endif %}>
            <label class="form-check-label" for="is_admin">{{ t('form.admin_rights') }}</label>
        </div>
    </div>
    <div class="col-12">
        <button type="submit" class="btn btn-primary">{{ t('action.save') }}</button>
        <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">{{ t('action.cancel') }}</a>
    </div>
</form>
{% endblock %}
